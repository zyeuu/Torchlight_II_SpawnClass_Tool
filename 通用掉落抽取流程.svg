<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 876" width="1000" height="876" role="img" aria-labelledby="title desc"><title id="title">火炬之光 II · 通用掉落抽取流程</title><desc id="desc">事件触发后读取入口，按次数抽取表。选中的条目可以递归调用子表、生成指定物品、按类型选物品，或返回空结果。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#476b70"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#123c42}.h{font-weight:700;font-size:19px}.b{font-size:15px;fill:#33575b}.k{font-size:13px;fill:#4a6a6a}</style><rect width="100%" height="100%" fill="#f4f6f1"/><text x="35" y="37" class="k" text-anchor="start">TORCHLIGHT II   /   MEDIA · SPAWNCLASSES</text><text x="35" y="70" class="h" text-anchor="start">通用掉落抽取流程</text><rect x="40" y="95" width="300" height="66" rx="12" fill="#fff" stroke="#9bb8b5"/><text x="190.0" y="122" class="h" text-anchor="middle">怪物 / 可交互物</text><text x="190.0" y="146" class="b" text-anchor="middle">死亡、开箱或钓鱼</text><rect x="350" y="95" width="300" height="66" rx="12" fill="#fff" stroke="#9bb8b5"/><text x="500.0" y="122" class="h" text-anchor="middle">关卡 / 场景对象</text><text x="500.0" y="146" class="b" text-anchor="middle">覆盖默认表或直接调用</text><rect x="660" y="95" width="300" height="66" rx="12" fill="#fff" stroke="#9bb8b5"/><text x="810.0" y="122" class="h" text-anchor="middle">任务 / 活动奖励</text><text x="810.0" y="146" class="b" text-anchor="middle">指定奖励表</text><path d="M190 161 V187 H500 V211" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><path d="M500 161 V187 V211" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><path d="M810 161 V187 H500 V211" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><rect x="190" y="213" width="620" height="81" rx="12" fill="#fff" stroke="#9bb8b5"/><text x="500.0" y="240" class="h" text-anchor="middle">① 读取有效入口与次数</text><text x="500.0" y="264" class="b" text-anchor="middle">单位可有主、次、第三 Treasure 槽，各自读取 MIN / MAX。</text><text x="500.0" y="286" class="b" text-anchor="middle">任务和场景按各自配置触发；箱子还要检查布局覆盖。</text><path d="M500 294 V324" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><rect x="190" y="326" width="620" height="100" rx="12" fill="#dfefea" stroke="#9bb8b5"/><text x="500.0" y="353" class="h" text-anchor="middle">② 每次调用一张 SpawnClass</text><text x="500.0" y="377" class="b" text-anchor="middle">普通正权重按合格条目的相对权重选取。</text><text x="500.0" y="399" class="b" text-anchor="middle">0 载入为 −1；两者均在满足条件时按次数执行（本机 Mac 版）。</text><path d="M500 426 V454" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><rect x="190" y="456" width="620" height="72" rx="12" fill="#fff" stroke="#9bb8b5"/><text x="500.0" y="483" class="h" text-anchor="middle">③ 对选中的每个条目读取数量</text><text x="500.0" y="507" class="b" text-anchor="middle">MINCOUNT / MAXCOUNT 控制本条目执行次数，缺省字段单独保留。</text><path d="M500 528 V553 H144 V578" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><path d="M500 528 V553 H382 V578" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><path d="M500 528 V553 H618 V578" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><path d="M500 528 V553 H855 V578" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><rect x="31" y="580" width="226" height="99" rx="12" fill="#fff" stroke="#9bb8b5"/><text x="144.0" y="607" class="h" text-anchor="middle">SPAWNCLASS</text><text x="144.0" y="631" class="b" text-anchor="middle">进入指定子表</text><text x="144.0" y="653" class="b" text-anchor="middle">重复步骤 ②、③</text><rect x="269" y="580" width="226" height="99" rx="12" fill="#fff" stroke="#9bb8b5"/><text x="382.0" y="607" class="h" text-anchor="middle">UNIT</text><text x="382.0" y="631" class="b" text-anchor="middle">指定具体单位</text><text x="382.0" y="653" class="b" text-anchor="middle">物品可查 UNITS 定义</text><rect x="505" y="580" width="226" height="99" rx="12" fill="#fff" stroke="#9bb8b5"/><text x="618.0" y="607" class="h" text-anchor="middle">UNITTYPE</text><text x="618.0" y="631" class="b" text-anchor="middle">按类型选候选物品</text><text x="618.0" y="653" class="b" text-anchor="middle">检查等级、品质及限制</text><rect x="742" y="580" width="226" height="99" rx="12" fill="#fff" stroke="#9bb8b5"/><text x="855.0" y="607" class="h" text-anchor="middle">NONE</text><text x="855.0" y="631" class="b" text-anchor="middle">当前分支空结果</text><text x="855.0" y="653" class="b" text-anchor="middle">其他槽位仍可继续</text><path d="M31 629 H15 V380 H187" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><path d="M382 679 V708 H620 V730" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><path d="M618 679 V708 H620 V730" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><path d="M855 679 V708 H620 V730" fill="none" stroke="#476b70" stroke-width="2" marker-end="url(#a)"/><rect x="337" y="732" width="566" height="66" rx="12" fill="#dfefea" stroke="#9bb8b5"/><text x="620.0" y="759" class="h" text-anchor="middle">④ 汇总本次触发的结果</text><text x="620.0" y="783" class="b" text-anchor="middle">处理剩余条目、重复抽取和其他入口。</text><text x="40" y="839" class="b" text-anchor="start">读表提示　进入子表的机会、选中目标的机会、物品最终生成的机会，应分别计算。</text></svg>